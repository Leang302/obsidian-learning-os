name: Release Obsidian plugin

# Standard Obsidian community-plugin release pattern: pushing a tag that
# matches the version in manifest.json builds main.js and attaches
# manifest.json / main.js / styles.css / versions.json to a GitHub
# Release with that tag. BRAT (and the official plugin updater) both
# install/update from these release assets, not from the repo tree.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run build

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "Release $tag" \
            manifest.json main.js styles.css versions.json
